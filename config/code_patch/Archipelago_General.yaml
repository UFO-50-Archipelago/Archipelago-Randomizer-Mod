        if (code == string_copy(stenAnswer, 4, 8))
    code: |-
        if (_cmd == "APCH" && global.server_release_mode > 0)
        {
            global.cheatID = 420;
            global.cheatedBypassTitle = true;
            global.cheatedNumPlayers = 1;
            return _param;
        }
        if (_cmd == "APGO" && global.server_release_mode > 0)
        {
            global.cheatID = 421;
            global.cheatedBypassTitle = true;
            global.cheatedNumPlayers = 1;
            return _param;
        }
