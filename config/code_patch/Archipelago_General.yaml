gml_GlobalScript_scrLoadProfile:
  - type: findprepend
    find: |-
      scrCloseCurrFile();
    code: |-
      global.ap_items_received = [];
      for (game = 0; game <= 51; game++)
          global.ap_items_received[game] = {};

      temp1 = variable_struct_get(global.currProfileSaveData, "apItemsReceived");
      if (!is_undefined(temp1))
          global.ap_items_received = temp1;

      global.ap_locations_found = [];
      for (game = 0; game <= 51; game++)
          global.ap_locations_found[game] = {};

      temp2 = variable_struct_get(global.currProfileSaveData, "apLocationsFound");
      if (!is_undefined(temp2))
          global.ap_locations_found = temp2;

      global.ap_scouts = [];
      for (game = 0; game <= 51; game++)
          global.ap_scouts[game] = {};

      temp3 = variable_struct_get(global.currProfileSaveData, "apScouts");
      if (!is_undefined(temp3))
          global.ap_locations_found = temp3;
