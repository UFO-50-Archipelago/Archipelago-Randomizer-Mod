        scrSaveGame(0);
  - type: findappend
    find: |-
        subMenu = scr19_MenuInput(pressLeft, pressRight, subMenu, 0, 4, true);
    code: |-
        while (!has_item(subMenu + 130) && subMenu != 0)
        {
            if (pressLeft)
                subMenu--;
            else if (pressRight && subMenu < 5)
                subMenu++;
            else
                subMenu = 0;
        }
  - type: findreplacetrim
    find: |-
        currPearlItem = global.g19_pearlContent[global.g19_pearlCount];
        var pearlItemName = ds_grid_get(global.g19_dsItem, currPearlItem, 0);
