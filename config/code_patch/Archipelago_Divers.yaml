        textBox[0] = scrStringVal("inside_pearl", "%% " + pearlItemName);
    code: |-
        var location = global.g19_pearlContent[global.g19_pearlCount];
        collect_location(location);
        player_id = get_location_player(location);
        player_name = scrStringManual("ap_for", 0) + " " + apclient_get_player_alias(player_id);
        game_name = apclient_get_player_game(player_id);
        item_name = apclient_get_item_name(get_location_item(location), game_name);
        str1 = player_name;
        str2 = item_name;
        str1 = string_upper(str1);
        str2 = string_upper(str2);
        o19_Mas.textBox[0] = "  " + str1;
        o19_Mas.textBox[1] = "  " + str2;
        textBoxLines = 1;
        currPearlItem = 60;
        var pearlItemName = ds_grid_get(global.g19_dsItem, currPearlItem, 0);
        pearlItemType = ds_grid_get(global.g19_dsItem, currPearlItem, 1);
        pearlItemElm = ds_grid_get(global.g19_dsItem, currPearlItem, 2);
gml_GlobalScript_scr19_SaveGame:
  - type: findprepend
    find: |-
        scrWriteReal("level", global.g19_level);
    code: |-
        for (i = 0; i < 9; i++)
            scrWriteReal("diversRelicCollected_" + string(i), global.diversRelicCollected[i]);
  - type: findprepend
    find: |-
        global.g19_level = scrReadReal("level", 1);
    code: |-
        for (i = 0; i < 85; i++)
            global.diversItemCollected[i] = scrReadReal("diversItemCollected_" + string(i), false);
        for (i = 0; i < 9; i++)
            global.diversRelicCollected[i] = scrReadReal("diversRelicCollected_" + string(i), false);
  - type: findreplace
    find: |-
        global.g19_chestOpen[i] = scrReadReal("chestOpen_" + string(i), false);
    code: |-
        global.g19_chestOpen[i] = is_location_collected(i);
gml_Object_o19_Mas_Other_12:
  - type: findprepend
    find: |-
        global.g19_cash = min(global.g19_cash + sumAdd, 9999);
    code: |-
        var cashMult = 1;
        t = get_item_count(90)
        for (i = 0; i < t; i++)
               cashMult = cashMult * 2;
        sumAdd = ceil(sumAdd * cashMult * (global.divers_cash / 100));
  - type: findreplacetrim
    find: |-
        if (global.g19_relicStock[relicRewardType] < 9)
            global.g19_relicStock[relicRewardType]++;
    code: |-
        if (relicRewardType == 6)
            global.g19_relicStock[relicRewardType] += global.divers_store_depth;
        else
            global.g19_relicStock[relicRewardType] += global.divers_relic_mult;
  - type: findprepend
    find: |-
        global.g19_experience += sumAdd;
    code: |-
        for (i = 0; i < 3; i++)
            if (has_item(120 + i))
                global.g19_emblem[i] = true;
        var xpMult = 1;
        var r = get_item_count(95)
        for (i = 0; i < r; i++)
               xpMult = xpMult * 2;
        sumAdd = ceil(sumAdd * xpMult * (global.divers_xp / 100));
  - type: findprepend
    find: |-
        global.g19_doorOpen[10] = true;
    code: |-
        collect_location(200);
gml_Object_o19_Chest_Step_0:
  - type: findreplacetrim
    find: |-
        if (state == -1)
        {
            if (global.g19_chestOpen[num])
            {
                state = 10;
                image_index = 1;
                visible = true;
            }
            else
            {
                state = 0;
            }
        }
    code: |-
        if (state == -1)
        {
            scout_location(num);
            if (global.g19_chestOpen[num])
            {
                state = 10;
                image_index = 1;
                visible = true;
            }
            else
            {
                state = 0;
            }
        }
  - type: findreplacetrim
    find: |-
        switch (type[num])
            {
                case "ITEM":
                    if (instance_exists(oPlayer))
                    {
                        global.g19_pearlCount++;
                        global.g19_pearlContent[global.g19_pearlCount] = value[num];
                        
                        if (global.g19_pearlCount == 1)
                        {
                            with (oPlayer)
                            {
                                for (var i = 0; i <= 40; i++)
                                {
                                    xPearl[i] = x;
                                    yPearl[i] = y;
                                }
                            }
                        }
                    }
                    
                    break;
                
                case "CASH":
                    global.g19_cash += value[num];
                    global.g19_cash = min(9999, global.g19_cash);
                    break;
                
                case "RELIC":
                    global.g19_relicStock[value[num]]++;
                    global.g19_relicStock[value[num]] = min(9, global.g19_relicStock[value[num]]);
                    break;
            }
    code: |-
        if (instance_exists(oPlayer) && global.divers_pearl)
        {
            global.g19_pearlCount++;
            global.g19_pearlContent[global.g19_pearlCount] = num;
            if (global.g19_pearlCount == 1)
            {
                with (oPlayer)
                {
                    for (var i = 0; i <= 40; i++)
                    {
                        xPearl[i] = x;
                        yPearl[i] = y;
                    }
                }
            }
        }
        else
            collect_location(num);
gml_Object_o19_Lizard_Step_0:
  - type: findreplace
    find: |-
        global.g19_emblem[emblem.num] = true;
    code: |-
        collect_location(100 + emblem.num);
  - type: findreplacetrim
    find: |-
        if (cSwitch.state == 0)
        {
            cSwitch.state = 1;
            
            with (o19_Mas)
                textBox = scr19_BGText("bg_flick_switch");
        }
        else
        {
            with (o19_Mas)
                textBox = scr19_BGText("bg_switch_done");
        }
    code: |-
        if (cSwitch.state == 0)
        {
            cSwitch.state = 1;
            o19_Mas.textBoxLines = 2;
            player_id = get_location_player(90 + cSwitch.num);
            game_name = apclient_get_player_game(player_id);
            player_name = scrStringManual("ap_for", 0) + " " + apclient_get_player_alias(player_id);
            item_name = apclient_get_item_name(get_location_item(90 + cSwitch.num), game_name);
            str1 = player_name;
            str2 = item_name;
            str1 = string_upper(str1);
            str2 = string_upper(str2);
            o19_Mas.textBox[0] = str1;
            o19_Mas.textBox[1] = str2;
        }
        else
        {
            with (o19_Mas)
                textBox = scr19_BGText("bg_switch_done");
        }
        
  - type: findreplacetrim
    find: |-
        switch (chestContent)
        {
            case "ITEM":
                with (o19_Mas)
                    textBox = scr19_BGText("bg_found_pearl");
                
                break;
            
            case "CASH":
                o19_Mas.textBoxLines = 1;
                o19_Mas.textBox[0] = scrStringVal("you_found_x", "%" + string(cChest.value[cChest.num]));
                o19_Mas.drawCoin = true;
                break;
            
            case "RELIC":
                o19_Mas.relicRewardType = cChest.value[cChest.num];
                o19_Mas.textBoxLines = 1;
                o19_Mas.textBox[0] = scrStringVal("you_found_x", "%");
                o19_Mas.drawRelic = true;
                break;
        }
    code: |-
        o19_Mas.textBoxLines = 2;
        player_id = get_location_player(cChest.num);
        game_name = apclient_get_player_game(player_id);
        player_name = scrStringManual("ap_for", 0) + " " + apclient_get_player_alias(player_id);
        item_name = apclient_get_item_name(get_location_item(cChest.num), game_name);
        str1 = player_name;
        str2 = item_name;
        str1 = string_upper(str1);
        str2 = string_upper(str2);
        o19_Mas.textBox[0] = str1;
        o19_Mas.textBox[1] = str2;
