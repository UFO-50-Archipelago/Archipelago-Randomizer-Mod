gml_Object_o19_Mas_Create_0:
  - type: findprepend
    find: |-
        scrLoadGame();
    code: |-
        for (i = 0; i < 9; i++)
            global.diversRelicCollected[i] = 0;
        for (i = 0; i < 3; i++)
            if (has_item(120 + i))
                global.g19_emblem[i] = true;
        for (s = 1; s <= global.divers_store_depth; s++)
        {
            var _depth = 100 * s;
            for (i = 0; i < 9; i++)
            {
                scout_location(_depth + 10 + i);
                hint_location(_depth + 10 + i);
            }
            for (i = 0; i < 6; i++)
            {
                scout_location(_depth + 20 + i);
                if (has_item(131))
                    hint_location(_depth + 20 + i);
            }
            for (i = 0; i < 9; i++)
            {
                scout_location(_depth + 30 + i);
                if (has_item(132))
                    hint_location(_depth + 30 + i);
            }
            for (i = 0; i < 5; i++)
            {
                scout_location(_depth + 40 + i);
                if (has_item(133))
                    hint_location(_depth + 40 + i);
            }
            for (i = 0; i < 3; i++)
            {
                scout_location(_depth + 50 + i);
                if (has_item(134))
                    hint_location(_depth + 50 + i);
            }
        }
gml_Object_o19_Mas_Draw_0:
  - type: findreplace
    find: |-
        draw_sprite(s19_MenuItemTab, i, xMenu + 32 + (16 * i), (yMenu - 8) + textInsert);
    code: |-
        if (i == 0 || has_item(130 + i))
            draw_sprite(s19_MenuItemTab, i, xMenu + 32 + (16 * i), (yMenu - 8) + textInsert);
  - type: findappend
    find: |-
        draw_sprite(s19_MenuItemType, currItemType + (cantSet[i] * 10), xMenu + 16 + xOff, yMenu + 16 + yOff);
    code: |-
        viewxRight = xv + 384;
        var cashMult = 1;
        tt = get_item_count(90);
        for (ii = 0; ii < tt; ii++)
            cashMult = cashMult * 2;
        cashMultDisplay = cashMult * (global.divers_cash / 100);
        var xpMult = 1;
        var rr = get_item_count(95);
        for (ii = 0; ii < rr; ii++)
            xpMult = xpMult * 2;
        var xpMultDisplay = xpMult * (global.divers_xp / 100);
        scrDrawMenuBorder((viewxRight - 82), yv, 82, 40);
        draw_text((viewxRight - 80) + 7, yv + 7, "XPx" + string(xpMultDisplay));
        draw_text((viewxRight - 80) + 7, yv + 22, "  x" + string(cashMultDisplay));
        draw_sprite(s19_MenuCoin, 0, (viewxRight - 80) + 7, yv + 22);
  - type: findreplacetrim
    find: |-
        if (i == menuSel)
            textInsert = -8;
    code: |-
        if (i == menuSel)
        {
            for (s = 1; s <= global.divers_store_depth; s++)
            {
                var _depth = 100 * s;
                if(!is_location_collected(_depth + 10 + (10 * subMenu) + i))
                    break;
            }
            var location = _depth + 10 + (10 * subMenu) + i;
            player_id = get_location_player(location);
            game_name = apclient_get_player_game(player_id);
            item_name = apclient_get_item_name(get_location_item(location), game_name);
            player_name = scrStringManual("ap_for", 0) + " " + apclient_get_player_alias(player_id);
            hint = item_name + "\n" + player_name;
            draw_text(xv + 5, yv + 5, hint);
            textInsert = -8;
        }
  - type: findreplacetrim
    find: |-
        var currItemName = ds_grid_get(global.g19_dsItem, itemListShop[subMenu][i], 0);
        var currItemHold = global.g19_invStock[itemListShop[subMenu][i]];
        var currItemMax = ds_grid_get(global.g19_dsItem, itemListShop[subMenu][i], 6);
    code: |-
        var currItemName = "AP" + ds_grid_get(global.g19_dsItem, itemListShop[subMenu][i], 0);
        var currItemMax = global.divers_store_depth;
        var currItemHold = 0;
        for (s = 1; s <= global.divers_store_depth; s++)
        {
            var _depth = 100 * s;
            if(is_location_collected(_depth + 10 + (10 * subMenu) + i))
                currItemHold++;
        }
  - type: findappend
    find: |-
        draw_text(xv + 16, yMenu + 8, textBox[0]);
    code: |-
        draw_text(xv + 16, yMenu + 18, textBox[1]);
  - type: findappend
    find: |-
        var xRelic, yRelic;
    code: |-
        while (global.diversRelicCollected[i] < get_item_count(110 + i))
        {
            if (i == 7)
                global.g19_relicStock[i] += global.divers_store_depth;
            else
                global.g19_relicStock[i] += global.divers_relic_mult;
            global.diversRelicCollected[i]++;
        }
        while global.diversRelicCollected[8] < get_item_count(110 + 8)
        {
            var cashMult = 1
            t = get_item_count(90)
            for (i = 0; i < t; i++)
               cashMult = cashMult * 2;
            global.g19_cash = min(global.g19_cash + ceil(500 * cashMult * (global.divers_cash / 100)), 9999);
            global.diversRelicCollected[8]++;
        }
