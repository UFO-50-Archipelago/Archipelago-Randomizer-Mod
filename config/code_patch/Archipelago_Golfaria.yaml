gml_GlobalScript_scr06_PlayerLaunch:
  - type: findappend
    find: |-
        o06__Game.golfStrokes -= 1;
    code: |-
        if (global.golfaria_start_brakes)
            o06__Game.golfBrake = true;
        else
            o06__Game.golfBrake = has_item(50);
        o06__Game.golfBuster = has_item(51);
        o06__Game.golfWaterRoll = has_item(52);
        o06__Game.golfSandRoll = has_item(53);
        sandWalk = o06__Game.golfSandRoll;
        waterWalk = o06__Game.golfWaterRoll;
        o06__Game.tee1 = has_item(30);
        o06__Game.tee2 = has_item(31);
        o06__Game.tee3 = has_item(32);
        o06__Game.tee4 = has_item(33);
        if (has_item(40))
            o06__Game.npcRescue[0] = "temple_north";
        if (has_item(41))
            o06__Game.npcRescue[1] = "temple_east";
        if (has_item(42))
            o06__Game.npcRescue[2] = "desert_cave";
        if (has_item(43))
            o06__Game.npcRescue[3] = "water_save_cave";
        if (has_item(44))
            o06__Game.npcRescue[4] = "water_cave";
        if (has_item(45))
            o06__Game.npcRescue[5] = "lake_center";
        if (has_item(46))
            o06__Game.npcRescue[6] = "im_lost";
        if (has_item(47))
            o06__Game.npcRescue[7] = "sandman";
        for (i = 0; i < get_item_count(0); i++)
        {
            o06__Game.clubs[i] = 1000;
        }
        if (get_item_count(0) > o06__Game.strokesCollected)
        {
            if (global.golfaria_difficulty != 4 || global.golfaria_endgame)
                o06__Game.golfStrokesMax = 20 + (get_item_count(0) * 3);
            else
                o06__Game.golfStrokesMax = min(global.golfaria_hardcore_strokes + get_item_count(0), 20);
            o06__Game.golfStrokes = o06__Game.golfStrokesMax;
            o06__Game.strokesCollected = get_item_count(0);
            scrSaveGame(0);
        }
        for (i = 0; i < get_item_count(20); i++)
            parbot[i] = true;
gml_GlobalScript_scr06_SaveGame:
  - type: findappend
    find: |-
        scrWriteReal("golfStrokesMax", golfStrokesMax);
    code: |-
        scrWriteReal("strokesCollected", strokesCollected);
  - type: findreplacetrim
    find: |-
        golfStrokesMax = scrReadReal("golfStrokesMax", 20);
        golfStrokes = golfStrokesMax;
        golfSandRoll = scrReadReal("golfSandRoll", 0);
        golfWaterRoll = scrReadReal("golfWaterRoll", 0);
        golfBuster = scrReadReal("golfBuster", 0);
        golfBrake = scrReadReal("golfBrake", 0);
        o06__Game.totalStrokesUsed = scrReadReal("totalStrokesUsed", 0);

        for (var i = 0; i < 4; i++)
            o06__Game.teesFound[i] = scrReadReal("tee" + string(i + 1), 0);

        tee1 = scrReadReal("tee1", 0);
        tee2 = scrReadReal("tee2", 0);
        tee3 = scrReadReal("tee3", 0);
        tee4 = scrReadReal("tee4", 0);
        
        for (var i = 0; i < 20; i++)
        {
            o06__Game.clubs[i] = scrReadReal("clubs" + string(i), 0);
            o06__Game.parbot[i] = scrReadReal("parBot" + string(i), 0);
            o06__Game.npcRescue[i] = scrReadString("npcRescue" + string(i), "");
